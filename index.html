<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Gym Tracker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    min-height: 100vh;
    padding: 20px;
    color: #fff;
  }
  .container {
    max-width: 700px;
    margin: 0 auto;
    background: #fff;
    color: #222;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  }
  h1 { text-align: center; color: #1e3c72; margin-bottom: 6px; font-size: 24px; }
  .subtitle { text-align: center; color: #666; font-size: 13px; margin-bottom: 20px; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
  th, td { padding: 12px 8px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
  th { background: #1e3c72; color: #fff; font-size: 13px; text-transform: uppercase; }
  tr:hover { background: #f5f8ff; }
  .day { font-weight: bold; color: #1e3c72; width: 70px; }
  .muscle { color: #333; }
  input[type="checkbox"] { width: 22px; height: 22px; cursor: pointer; accent-color: #2a5298; }
  .off-row { background: #fff3cd; }
  .off-row td { color: #856404; font-style: italic; }
  .footer { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; gap: 10px; flex-wrap: wrap; }
  .progress-text { font-size: 14px; color: #444; font-weight: bold; }
  button { background: #e74c3c; color: #fff; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; transition: 0.2s; }
  button:hover { background: #c0392b; }
  .saved { text-align: center; font-size: 12px; color: #27ae60; margin-top: 10px; height: 16px; }
  .progress-bar { width: 100%; height: 10px; background: #eee; border-radius: 5px; overflow: hidden; margin-bottom: 16px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #27ae60, #2ecc71); width: 0%; transition: width 0.3s; }
</style>
</head>
<body>
<div class="container">
  <h1>🏋️ My Gym Tracker</h1>
  <p class="subtitle">Data apne aap save hota hai</p>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <table>
    <thead>
      <tr><th>Din</th><th>Muscle</th><th>Done?</th><th>Weight Barha?</th></tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
  <div class="footer">
    <span class="progress-text" id="progressText">0 / 6 complete</span>
    <button onclick="resetAll()">🔄 Reset All</button>
  </div>
  <div class="saved" id="savedMsg"></div>
</div>
<script>
  const days = [
    { day: "Sat", muscle: "Chest + Triceps", off: false },
    { day: "Sun", muscle: "Back + Biceps", off: false },
    { day: "Mon", muscle: "Shoulder + Traps", off: false },
    { day: "Tue", muscle: "Chest + Triceps", off: false },
    { day: "Wed", muscle: "Back + Biceps", off: false },
    { day: "Thu", muscle: "Legs + Abs", off: false },
    { day: "Fri", muscle: "OFF", off: true }
  ];
  const STORAGE_KEY = "gymTrackerData";
  function loadData() {
    const saved = localStorage.getItem(STORAGE_KEY);
    return saved ? JSON.parse(saved) : {};
  }
  function saveData(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    showSaved();
  }
  let savedTimer;
  function showSaved() {
    const msg = document.getElementById("savedMsg");
    msg.textContent = "✅ Saved";
    clearTimeout(savedTimer);
    savedTimer = setTimeout(() => { msg.textContent = ""; }, 1000);
  }
  function buildTable() {
    const data = loadData();
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";
    days.forEach((item, i) => {
      const tr = document.createElement("tr");
      if (item.off) tr.classList.add("off-row");
      tr.innerHTML = `
        <td class="day">${item.day}</td>
        <td class="muscle">${item.muscle}</td>
        <td>${item.off ? "☐" : `<input type="checkbox" data-i="${i}" data-k="done" ${data[i]?.done ? "checked" : ""}>`}</td>
        <td>${item.off ? "—" : `<input type="checkbox" data-i="${i}" data-k="weight" ${data[i]?.weight ? "checked" : ""}>`}</td>
      `;
      tbody.appendChild(tr);
    });
    tbody.querySelectorAll("input[type=checkbox]").forEach(cb => {
      cb.addEventListener("change", (e) => {
        const i = e.target.dataset.i;
        const k = e.target.dataset.k;
        const d = loadData();
        if (!d[i]) d[i] = {};
        d[i][k] = e.target.checked;
        saveData(d);
        updateProgress();
      });
    });
    updateProgress();
  }
  function updateProgress() {
    const data = loadData();
    let done = 0;
    days.forEach((item, i) => { if (!item.off && data[i]?.done) done++; });
    document.getElementById("progressText").textContent = `${done} / 6 complete`;
    document.getElementById("progressFill").style.width = (done / 6 * 100) + "%";
  }
  function resetAll() {
    if (confirm("Kya aap sara data delete karna chahte hain?")) {
      localStorage.removeItem(STORAGE_KEY);
      buildTable();
    }
  }
  buildTable();
</script>
</body>
</html>
